<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk mobile · Saved</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <main style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 28px 20px 120px; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 class="h1">Saved</h1>
        <span class="body-s" style="color: var(--muted)">8 cars · 4 inspected</span>
      </div>
      <x-import component-from-global-scope="AutoSouk.IconButton" name="sliders"></x-import>
    </div>
    <sc-for list="{{cars}}" as="c" hint-placeholder-count="4">
      <a href="M-Listing.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 24px; background: var(--surface); box-shadow: var(--elevation-1); text-decoration: none; color: inherit">
        <x-import component-from-global-scope="AutoSouk.CarPhoto" tone="{{c.tone}}" width="{{w104}}" height="{{h84}}" radius="{{r14}}"></x-import>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span class="h5" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
          <span class="body-xs" style="color: var(--muted)">{{c.meta}}</span>
          <span style="display: flex; justify-content: space-between; align-items: center">
            <span style="display: flex; gap: 4px; align-items: baseline"><span class="h4">{{c.price}}</span><span class="mono-s" style="color: var(--muted)">MAD</span></span>
            <sc-if value="{{c.ins}}" hint-placeholder-val="{{yes}}"><x-import component-from-global-scope="AutoSouk.Badge" tone="success" dot="{{no}}">Inspected</x-import></sc-if>
            <sc-if value="{{c.notIns}}" hint-placeholder-val="{{no}}"><span class="label-s" style="color: var(--brand)">Inspect →</span></sc-if>
          </span>
        </span>
        <x-import component-from-global-scope="AutoSouk.Icon" name="heart" size="{{s20}}" color="danger" fill="danger" label="Saved"></x-import>
      </a>
    </sc-for>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <x-import component-from-global-scope="AutoSouk.TabBar" active="Saved"></x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cars = [
      { title: 'Volkswagen Golf 8 Life', meta: '2020 · 54 000 km · Rabat', price: '265 000', tone: 'night', ins: true },
      { title: 'Toyota Corolla Hybrid', meta: '2021 · 72 000 km · Casablanca', price: '245 000', tone: 'olive', ins: true },
      { title: 'Fiat 500 Dolcevita', meta: '2022 · 18 000 km · Agadir', price: '139 000', tone: 'saffron', ins: false },
      { title: 'Peugeot 3008 GT Line', meta: '2019 · 98 000 km · Marrakech', price: '238 000', tone: 'clay', ins: false }
    ].map((c) => ({ ...c, notIns: !c.ins }));
    return { yes: true, no: false, s20: 20, w104: 104, h84: 84, r14: 14, cars };
  }
}
</script>
</body>
</html>
