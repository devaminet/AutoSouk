<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk · Choose a new password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 100%; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <div aria-hidden="true" style="position: absolute; right: -80px; top: 60px; pointer-events: none; opacity: 0.45"><x-import component-from-global-scope="AutoSouk.ZelligePattern" width="{{p680}}" height="{{p840}}"></x-import></div>
  <header style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 24px clamp(20px, 4vw, 48px)">
    <x-import component-from-global-scope="AutoSouk.Logo"></x-import>
    <span style="display: flex; gap: 8px; align-items: center"><span class="body-s" style="color: var(--muted)">Need help?</span><x-import component-from-global-scope="AutoSouk.Button" variant="secondary" size="S">Contact support</x-import></span>
  </header>
  <main style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 20px 64px">
    <form style="width: 100%; max-width: 480px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; padding: clamp(24px, 4vw, 40px); border-radius: 28px; background: var(--surface); box-shadow: var(--elevation-2)">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <x-import component-from-global-scope="AutoSouk.Badge" tone="success">Link verified</x-import>
        <h1 class="h1">Choose a new password</h1>
        <p class="body-m" style="color: var(--muted)">Make it strong — you'll use it on every device.</p>
      </div>
      <x-import component-from-global-scope="AutoSouk.Input" label="New password" value="••••••••••••" icon="lock"></x-import>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <span style="height: 4px; border-radius: 2px; background: var(--success)"></span>
        <span style="height: 4px; border-radius: 2px; background: var(--success)"></span>
        <span style="height: 4px; border-radius: 2px; background: var(--success)"></span>
        <span style="height: 4px; border-radius: 2px; background: var(--success)"></span>
      </div>
      <x-import component-from-global-scope="AutoSouk.Input" label="Confirm password" value="•••••••••" icon="lock" state="error" helper="Passwords don't match"></x-import>
      <a href="Login.dc.html" class="label-l" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: var(--brand); color: var(--on-brand); text-decoration: none; box-shadow: var(--elevation-brand)">Update password</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { p680: 680, p840: 840 };
  }
}
</script>
</body>
</html>
