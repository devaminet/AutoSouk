<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk mobile · New listing · Equipment</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <div style="padding-top: 12px"><x-import component-from-global-scope="AutoSouk.MobileHeader" variant="back" title="New listing"></x-import></div>
  <main style="flex: 1; display: flex; flex-direction: column; padding: 4px 20px 120px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span class="overline" style="color: var(--brand)">Step 2 of 4 · Car details</span>
      <span aria-hidden="true" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
        <span style="height: 4px; border-radius: 2px; background: var(--success)"></span>
        <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
        <span style="height: 4px; border-radius: 2px; background: var(--line)"></span>
        <span style="height: 4px; border-radius: 2px; background: var(--line)"></span>
      </span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 18px">
      <h1 class="h1">Equipment</h1>
      <x-import component-from-global-scope="AutoSouk.Badge" tone="brand" dot="{{no}}">{{picked}} selected</x-import>
    </div>
    <p class="body-s" style="margin: 6px 0 14px; color: var(--muted)">Optional. Tick only what the car really has.</p>
    <x-import component-from-global-scope="AutoSouk.Input" placeholder="Search, e.g. CarPlay" icon="search"></x-import>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <x-import component-from-global-scope="AutoSouk.EquipmentGroup" title="{{g.title}}" icon="{{g.icon}}" mode="select" collapsible="{{yes}}" open="{{g.open}}" items="{{g.items}}" flush="{{g.last}}"></x-import>
    </sc-for>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: var(--surface); border-top: 1px solid var(--line)">
    <a href="M-Sell-Photos.dc.html" class="label-l" style="height: 56px; border-radius: 999px; background: var(--brand); color: var(--on-brand); text-decoration: none; display: flex; gap: 10px; align-items: center; justify-content: center; box-shadow: var(--elevation-brand)">Continue to photos <x-import component-from-global-scope="AutoSouk.Icon" name="arrow-right" size="{{s20}}" color="on-brand"></x-import></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (all, on) => all.map((name) => ({ name, selected: on.indexOf(name) > -1 }));
    const cat = [
      ['Safety', 'shield', false, ['ABS', 'ESP', 'Front airbags', 'Side airbags', 'Curtain airbags', 'Knee airbag', 'ISOFIX', 'Tire pressure monitoring', 'Emergency braking', 'Alarm', 'Immobilizer', 'Central locking', 'Remote locking'], ['ABS', 'ESP', 'Front airbags', 'Side airbags', 'Curtain airbags', 'ISOFIX', 'Tire pressure monitoring', 'Emergency braking', 'Immobilizer', 'Central locking', 'Remote locking']],
      ['Driving assistance', 'navigation', false, ['Cruise control', 'Adaptive cruise control', 'Speed limiter', 'Lane departure warning', 'Lane keep assist', 'Blind spot monitoring', 'Traffic sign recognition', 'Hill start assist', 'Front parking sensors', 'Rear parking sensors', 'Rear camera', '360° camera', 'Self-parking', 'Start-stop', 'Rain sensor', 'Light sensor'], ['Cruise control', 'Adaptive cruise control', 'Speed limiter', 'Lane departure warning', 'Lane keep assist', 'Traffic sign recognition', 'Hill start assist', 'Front parking sensors', 'Rear parking sensors', 'Start-stop', 'Rain sensor', 'Light sensor']],
      ['Comfort', 'armchair', false, ['Manual air conditioning', 'Automatic climate control', 'Dual-zone climate control', 'Front power windows', 'Rear power windows', 'Power mirrors', 'Heated mirrors', 'Folding mirrors', 'Power steering', 'Leather seats', 'Heated seats', 'Ventilated seats', 'Power seats', 'Memory seats', 'Armrest', 'Heated steering wheel', 'Keyless entry', 'Push-button start', 'Power tailgate', 'Sunroof', 'Panoramic roof'], ['Automatic climate control', 'Dual-zone climate control', 'Front power windows', 'Rear power windows', 'Power mirrors', 'Heated mirrors', 'Folding mirrors', 'Power steering', 'Armrest', 'Keyless entry', 'Push-button start']],
      ['Multimedia', 'music', true, ['Radio', 'CD/DVD player', 'Bluetooth', 'USB/AUX', 'GPS navigation', 'Touchscreen', 'Apple CarPlay', 'Android Auto', 'Premium sound system', 'Wireless charging', 'Digital instrument cluster', 'Head-up display', 'Rear entertainment'], ['Radio', 'Bluetooth', 'USB/AUX', 'GPS navigation', 'Touchscreen', 'Apple CarPlay', 'Android Auto', 'Wireless charging', 'Digital instrument cluster']],
      ['Exterior', 'car', false, ['LED headlights', 'Xenon headlights', 'Fog lights', 'Daytime running lights', 'Alloy wheels', 'Roof rails', 'Tow hitch', 'Tinted windows', 'Spare wheel'], ['LED headlights', 'Daytime running lights', 'Alloy wheels', 'Spare wheel']]
    ];
    return {
      yes: true, no: false, s20: 20,
      picked: cat.reduce((n, c) => n + c[4].length, 0),
      groups: cat.map((c, i) => ({ title: c[0], icon: c[1], open: c[2], items: pick(c[3], c[4]), last: i === cat.length - 1 }))
    };
  }
}
</script>
</body>
</html>
