<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk mobile · Filters</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <div style="padding-top: 12px"><x-import component-from-global-scope="AutoSouk.MobileHeader"></x-import></div>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px">
    <h1 class="h1">Explore</h1>
    <x-import component-from-global-scope="AutoSouk.ListingCard" fluid="{{yes}}" title="Volkswagen Golf 8 Life" meta="2020 · 54 000 km · Diesel" price="265 000" city="Rabat" tone="night" inspected-score="{{s92}}" photos="{{n12}}"></x-import>
  </main>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,14,28,0.45)"></div>
  <section role="dialog" aria-label="Filters" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 18px; padding: 12px 20px 32px; border-radius: 28px 28px 0 0; background: var(--surface)">
    <span aria-hidden="true" style="width: 40px; height: 5px; border-radius: 3px; background: var(--line-strong); align-self: center"></span>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h2 class="h3">Filters</h2>
      <button type="button" class="label-m" style="border: 0; background: none; color: var(--brand)">Reset</button>
    </div>
    <div style="display: flex; gap: 12px">
      <x-import component-from-global-scope="AutoSouk.Input" label="Make" value="Volkswagen" select="{{yes}}"></x-import>
      <x-import component-from-global-scope="AutoSouk.Input" label="Model" placeholder="Any model" select="{{yes}}"></x-import>
    </div>
    <x-import component-from-global-scope="AutoSouk.Input" label="City" value="Casablanca" icon="map-pin" select="{{yes}}"></x-import>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between"><span class="label-m">Price (MAD)</span><span class="mono-s" style="color: var(--muted)">80k – 300k</span></div>
      <div aria-hidden="true" style="position: relative; height: 20px">
        <span style="position: absolute; left: 0; right: 0; top: 8px; height: 4px; border-radius: 2px; background: var(--line)"></span>
        <span style="position: absolute; left: 12%; width: 52%; top: 8px; height: 4px; background: var(--brand)"></span>
        <span style="position: absolute; left: 10%; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--brand)"></span>
        <span style="position: absolute; left: 61%; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 2px var(--brand)"></span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span class="label-m">Sort by</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <x-import component-from-global-scope="AutoSouk.Chip" selected="{{yes}}">Newest</x-import>
        <x-import component-from-global-scope="AutoSouk.Chip">Oldest</x-import>
        <x-import component-from-global-scope="AutoSouk.Chip">Price ↑</x-import>
        <x-import component-from-global-scope="AutoSouk.Chip">Price ↓</x-import>
      </div>
    </div>
    <a href="M-Equipment.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line-strong); text-decoration: none; color: inherit">
      <x-import component-from-global-scope="AutoSouk.Icon" name="check-circle" size="{{s20}}"></x-import>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span class="label-m">Equipment</span><span class="body-xs" style="color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Apple CarPlay · Rear camera</span></span>
      <x-import component-from-global-scope="AutoSouk.Badge" tone="brand" dot="{{no}}">2</x-import>
      <x-import component-from-global-scope="AutoSouk.Icon" name="chevron-right" size="{{s18}}" color="muted"></x-import>
    </a>
    <label style="display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--success-soft)">
      <x-import component-from-global-scope="AutoSouk.Icon" name="shield" size="{{s20}}" color="success"></x-import>
      <span class="label-m" style="flex: 1">Inspected only</span>
      <x-import component-from-global-scope="AutoSouk.Toggle" on="{{yes}}"></x-import>
    </label>
    <x-import component-from-global-scope="AutoSouk.Button" variant="dark" size="L" block="{{yes}}">Show 21 cars</x-import>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false, s18: 18, s20: 20, s92: 92, n12: 12 };
  }
}
</script>
</body>
</html>
