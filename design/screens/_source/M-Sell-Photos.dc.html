<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk mobile · Add photos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <div style="padding-top: 12px"><x-import component-from-global-scope="AutoSouk.MobileHeader" variant="back" title="New listing"></x-import></div>
  <main style="flex: 1; display: flex; flex-direction: column; gap: 20px; padding: 8px 20px 120px; overflow: hidden">
    <div role="progressbar" aria-label="Step 3 of 4" aria-valuenow="3" aria-valuemin="1" aria-valuemax="4" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      <span style="height: 4px; border-radius: 2px; background: var(--success)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--success)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--line)"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 class="h1">Add photos</h1>
      <p class="body-s" style="color: var(--muted)">At least 3 photos. Tap ☆ to choose the cover.</p>
    </div>
    <x-import component-from-global-scope="AutoSouk.MediaLimits" images="{{n2}}" videos="{{n1}}" pending="{{n1}}"></x-import>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <x-import component-from-global-scope="AutoSouk.UploadTile" state="cover" tone="night" actions="{{yes}}" width="{{w170}}" height="{{h130}}"></x-import>
      <x-import component-from-global-scope="AutoSouk.UploadTile" state="filled" tone="sand" actions="{{yes}}" width="{{w170}}" height="{{h130}}"></x-import>
      <x-import component-from-global-scope="AutoSouk.UploadTile" state="filled" tone="olive" video="{{yes}}" duration="0:24" actions="{{yes}}" width="{{w170}}" height="{{h130}}"></x-import>
      <x-import component-from-global-scope="AutoSouk.UploadTile" state="uploading" tone="clay" width="{{w170}}" height="{{h130}}"></x-import>
      <x-import component-from-global-scope="AutoSouk.UploadTile" state="empty" label="Add photo" width="{{w170}}" height="{{h130}}"></x-import>
    </div>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; padding: 14px 20px 30px; background: var(--surface); border-top: 1px solid var(--line)">
    <x-import component-from-global-scope="AutoSouk.Button" variant="secondary" size="L" icon="camera">Camera</x-import>
    <span aria-disabled="true" class="label-l" style="flex: 1; display: flex; gap: 10px; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: var(--line); color: var(--muted)">Add 1 more photo</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, n1: 1, n2: 2, s20: 20, w170: 170, h130: 130 };
  }
}
</script>
</body>
</html>
