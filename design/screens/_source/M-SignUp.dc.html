<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk mobile · Sign up</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans)">
  <form style="display: flex; flex-direction: column; gap: 16px; padding: 28px 20px 32px">
    <x-import component-from-global-scope="AutoSouk.Logo"></x-import>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 class="h1">Create your account</h1>
      <p class="body-m" style="color: var(--muted)">Choose how you'll use AutoSouk.</p>
    </div>
    <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend class="label-m" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">I want to</legend>
      <sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
        <label style="display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 16px; background: {{r.bg}}; box-shadow: {{r.ring}}">
          <span style="width: 36px; height: 36px; border-radius: 10px; background: {{r.ibg}}; display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="AutoSouk.Icon" name="{{r.icon}}" size="{{s18}}" color="{{r.ic}}"></x-import></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span class="label-l">{{r.name}}</span><span class="body-xs" style="color: var(--muted)">{{r.d}}</span></span>
          <x-import component-from-global-scope="AutoSouk.Radio" checked="{{r.on}}"></x-import>
        </label>
      </sc-for>
    </fieldset>
    <div style="display: flex; gap: 12px">
      <x-import component-from-global-scope="AutoSouk.Input" label="First name" value="Amine" style="flex: 1"></x-import>
      <x-import component-from-global-scope="AutoSouk.Input" label="Last name" value="Takha" style="flex: 1"></x-import>
    </div>
    <x-import component-from-global-scope="AutoSouk.Input" label="Email" value="amine@autosouk.ma" icon="mail"></x-import>
    <x-import component-from-global-scope="AutoSouk.Input" label="Phone" value="+212 6 12 34 56 78" icon="phone"></x-import>
    <a href="M-Verify.dc.html" class="label-l" style="display: flex; gap: 10px; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: var(--brand); color: var(--on-brand); text-decoration: none; box-shadow: var(--elevation-brand)">Continue <x-import component-from-global-scope="AutoSouk.Icon" name="arrow-right" size="{{s20}}" color="on-brand"></x-import></a>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const role = (name, icon, d, on) => ({ name, icon, d, on, bg: on ? 'var(--brand-soft)' : 'var(--surface)', ring: on ? 'inset 0 0 0 2px var(--brand)' : 'inset 0 0 0 1px var(--line)', ibg: on ? 'var(--brand)' : 'var(--paper)', ic: on ? 'on-brand' : 'ink' });
    return { s18: 18, s20: 20, roles: [role('Buyer', 'car', 'Browse, save and inspect cars', true), role('Seller', 'grid', 'List and manage your cars', false), role('Mechanic', 'wrench', 'Offer paid inspections', false)] };
  }
}
</script>
</body>
</html>
