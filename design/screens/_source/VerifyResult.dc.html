<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AutoSouk · E-mail vérifié</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div lang="fr" style="width: 100%; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px clamp(20px, 4vw, 48px)">
    <x-import component-from-global-scope="AutoSouk.Logo"></x-import>
    <x-import component-from-global-scope="AutoSouk.LanguageSwitch" active="fr" lang="fr"></x-import>
  </header>
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px 80px">
    <section style="position: relative; overflow: hidden; width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 24px; padding: clamp(28px, 5vw, 48px); border-radius: 32px; background: var(--surface); box-shadow: var(--elevation-2); text-align: center">
      <span style="width: 96px; height: 96px; border-radius: 999px; background: var(--success-soft); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="AutoSouk.Icon" name="check-circle" size="{{s48}}" color="success"></x-import></span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 class="h1">Votre compte a été vérifié</h1>
        <p class="body-m" style="color: var(--muted)">Connectez-vous pour enregistrer des voitures, publier une annonce ou demander une inspection.</p>
      </div>
      <a href="Login.dc.html" class="label-l" style="width: 100%; height: 56px; border-radius: 999px; background: var(--brand); color: var(--on-brand); text-decoration: none; display: flex; gap: 10px; align-items: center; justify-content: center; box-shadow: var(--elevation-brand)">Se connecter <x-import component-from-global-scope="AutoSouk.Icon" name="arrow-right" size="{{s20}}" color="on-brand"></x-import></a>
      <a href="Main.dc.html" class="label-m">Parcourir les voitures</a>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { s20: 20, s48: 48 };
  }
}
</script>
</body>
</html>
