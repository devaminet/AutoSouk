<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk mobile · Workshop setup</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <div style="padding-top: 12px"><x-import component-from-global-scope="AutoSouk.MobileHeader" variant="back" title="Workshop setup"></x-import></div>
  <form style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 8px 20px 120px; overflow: hidden">
    <div role="progressbar" aria-label="Step 2 of 3" aria-valuenow="2" aria-valuemin="1" aria-valuemax="3" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <span style="height: 4px; border-radius: 2px; background: var(--success)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--brand)"></span>
      <span style="height: 4px; border-radius: 2px; background: var(--line)"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px"><h1 class="h1">Where is your workshop?</h1><p class="body-s" style="color: var(--muted)">Buyers looking at cars in your city will find you.</p></div>
    <x-import component-from-global-scope="AutoSouk.Input" label="City" value="Casablanca" icon="map-pin" select="{{yes}}"></x-import>
    <x-import component-from-global-scope="AutoSouk.Input" label="Address" value="27 Rue Ibnou Mounir, Maârif" state="focus"></x-import>
    <div style="border-radius: 20px; overflow: hidden"><x-import component-from-global-scope="AutoSouk.MapView" height="{{h170}}" radius="{{r20}}" pins="{{pin}}"></x-import></div>
    <x-import component-from-global-scope="AutoSouk.Input" label="Inspection price" value="350" suffix="MAD"></x-import>
  </form>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: var(--surface); border-top: 1px solid var(--line)">
    <x-import component-from-global-scope="AutoSouk.Button" size="L" icon-right="arrow-right" block="{{yes}}">Continue</x-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, h170: 170, r20: 20, pin: [{ x: 50, y: 50, active: true }] };
  }
}
</script>
</body>
</html>
