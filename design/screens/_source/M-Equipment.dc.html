<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk mobile · Equipment filter</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <div style="padding-top: 12px"><x-import component-from-global-scope="AutoSouk.MobileHeader" variant="back" title="Equipment"></x-import></div>
  <main style="flex: 1; display: flex; flex-direction: column; padding: 4px 20px 120px; overflow: hidden">
    <x-import component-from-global-scope="AutoSouk.Input" placeholder="Search 72 items" icon="search"></x-import>
    <p class="body-s" style="margin: 12px 0 0; color: var(--muted)">Only cars that have every item you pick are shown.</p>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 14px">
      <x-import component-from-global-scope="AutoSouk.Chip" removable="{{yes}}" selected="{{yes}}">Apple CarPlay</x-import>
      <x-import component-from-global-scope="AutoSouk.Chip" removable="{{yes}}" selected="{{yes}}">Rear camera</x-import>
    </div>
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
      <x-import component-from-global-scope="AutoSouk.EquipmentGroup" title="{{g.title}}" icon="{{g.icon}}" mode="select" collapsible="{{yes}}" open="{{g.open}}" items="{{g.items}}" flush="{{g.last}}"></x-import>
    </sc-for>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 14px 20px 30px; background: var(--surface); border-top: 1px solid var(--line)">
    <x-import component-from-global-scope="AutoSouk.Button" variant="ghost" size="L">Clear</x-import>
    <a href="M-Filters.dc.html" class="label-l" style="flex: 1; height: 56px; border-radius: 999px; background: var(--ink); color: var(--surface); text-decoration: none; display: flex; align-items: center; justify-content: center">Show 21 cars</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (all, on) => all.map((name) => ({ name, selected: on.indexOf(name) > -1 }));
    const cat = [
      ['Safety', 'shield', false, ['ABS', 'ESP', 'Front airbags', 'Side airbags', 'Curtain airbags', 'Knee airbag', 'ISOFIX', 'Tire pressure monitoring', 'Emergency braking', 'Alarm', 'Immobilizer', 'Central locking', 'Remote locking'], []],
      ['Driving assistance', 'navigation', true, ['Cruise control', 'Adaptive cruise control', 'Speed limiter', 'Lane departure warning', 'Lane keep assist', 'Blind spot monitoring', 'Traffic sign recognition', 'Hill start assist', 'Front parking sensors', 'Rear parking sensors', 'Rear camera', '360° camera', 'Self-parking', 'Start-stop', 'Rain sensor', 'Light sensor'], ['Rear camera']],
      ['Comfort', 'armchair', false, ['Manual air conditioning', 'Automatic climate control', 'Dual-zone climate control', 'Leather seats', 'Heated seats', 'Keyless entry', 'Panoramic roof'], []],
      ['Multimedia', 'music', false, ['Bluetooth', 'GPS navigation', 'Apple CarPlay', 'Android Auto'], ['Apple CarPlay']],
      ['Exterior', 'car', false, ['LED headlights', 'Alloy wheels', 'Tow hitch'], []]
    ];
    return {
      yes: true,
      groups: cat.map((c, i) => ({ title: c[0], icon: c[1], open: c[2], items: pick(c[3], c[4]), last: i === cat.length - 1 }))
    };
  }
}
</script>
</body>
</html>
