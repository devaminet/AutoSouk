<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk mobile · Verify email</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--paper); color: var(--ink); font-family: var(--font-sans)">
  <main style="display: flex; flex-direction: column; align-items: center; gap: 24px; padding: 120px 24px 40px; text-align: center">
    <span style="width: 120px; height: 120px; border-radius: 999px; background: var(--brand-soft); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="AutoSouk.Icon" name="mail" size="{{s52}}" color="brand"></x-import></span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 class="h1">Check your inbox</h1>
      <p class="body-m" style="color: var(--muted)">Tap the link we sent to amine@autosouk.ma to activate your account.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%">
      <x-import component-from-global-scope="AutoSouk.Button" variant="dark" size="L" icon="mail" block="{{yes}}">Open mail app</x-import>
      <x-import component-from-global-scope="AutoSouk.Button" variant="secondary" size="L" icon="refresh" block="{{yes}}" disabled="{{yes}}">Resend in 0:42</x-import>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, s52: 52 };
  }
}
</script>
</body>
</html>
