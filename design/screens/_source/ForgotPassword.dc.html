<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk · Reset your password</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div style="position: relative; overflow: hidden; width: 100%; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-sans); display: flex; flex-direction: column">
  <div aria-hidden="true" style="position: absolute; right: -80px; top: 60px; pointer-events: none; opacity: 0.45"><x-import component-from-global-scope="AutoSouk.ZelligePattern" width="{{p680}}" height="{{p840}}"></x-import></div>
  <header style="position: relative; display: flex; justify-content: space-between; align-items: center; padding: 24px clamp(20px, 4vw, 48px)">
    <x-import component-from-global-scope="AutoSouk.Logo"></x-import>
    <span style="display: flex; gap: 8px; align-items: center"><span class="body-s" style="color: var(--muted)">Remembered it?</span><a href="Login.dc.html" class="label-s" style="display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border-radius: 999px; background: var(--surface); color: var(--ink); text-decoration: none; box-shadow: inset 0 0 0 1px var(--line-strong)">Log in</a></span>
  </header>
  <main style="position: relative; flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 20px 64px">
    <form style="width: 100%; max-width: 480px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: clamp(24px, 4vw, 40px); border-radius: 28px; background: var(--surface); box-shadow: var(--elevation-2)">
      <span style="width: 56px; height: 56px; border-radius: 16px; background: var(--paper); display: flex; align-items: center; justify-content: center"><x-import component-from-global-scope="AutoSouk.Icon" name="key" size="{{s26}}"></x-import></span>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 class="h1">Reset your password</h1>
        <p class="body-m" style="color: var(--muted)">Enter the email linked to your account and we'll send you a secure reset link.</p>
      </div>
      <x-import component-from-global-scope="AutoSouk.Input" label="Email" value="amine@autosouk.ma" icon="mail" state="focus"></x-import>
      <a href="NewPassword.dc.html" class="label-l" style="display: flex; gap: 10px; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: var(--brand); color: var(--on-brand); text-decoration: none; box-shadow: var(--elevation-brand)">Send reset link <x-import component-from-global-scope="AutoSouk.Icon" name="arrow-right" size="{{s20}}" color="on-brand"></x-import></a>
      <a href="Login.dc.html" class="label-s" style="display: flex; gap: 6px; align-items: center; justify-content: center; color: var(--muted); text-decoration: none"><x-import component-from-global-scope="AutoSouk.Icon" name="arrow-left" size="{{s16}}" color="muted"></x-import>Back to log in</a>
    </form>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { s16: 16, s20: 20, s26: 26, p680: 680, p840: 840 };
  }
}
</script>
</body>
</html>
