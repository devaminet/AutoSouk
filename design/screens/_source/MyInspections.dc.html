<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AutoSouk · My inspections</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="as-tokens.css">
<link rel="stylesheet" href="ds/autosouk/components/bundle.css">
<script src="ds/autosouk/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--brand)}a:hover{color:var(--brand-hover)}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: var(--font-sans); overflow-x: hidden">
  <div style="overflow-x: auto">
    <x-import component-from-global-scope="AutoSouk.NavDesktop" active="Inspections"></x-import>
  </div>
  <main style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-direction: column; gap: 32px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px"><span class="overline" style="color: var(--brand)">Buyer</span><h1 class="display-m">My inspections</h1></div>
      <a href="Search.dc.html" class="label-m" style="display: inline-flex; gap: 8px; align-items: center; height: 44px; padding: 0 18px; border-radius: 999px; background: var(--brand); color: var(--on-brand); text-decoration: none; box-shadow: var(--elevation-brand)"><x-import component-from-global-scope="AutoSouk.Icon" name="plus" size="{{s18}}" color="on-brand"></x-import>Request a new one</a>
    </div>
    <div style="overflow-x: auto"><x-import component-from-global-scope="AutoSouk.Tabs" items="{{tabs}}" active="All"></x-import></div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{items}}" as="i" hint-placeholder-count="5">
        <article style="display: flex; flex-wrap: wrap; gap: 20px; align-items: center; padding: 16px 20px 16px 16px; border-radius: 24px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line)">
          <x-import component-from-global-scope="AutoSouk.CarPhoto" tone="{{i.tone}}" width="{{w120}}" height="{{h88}}" radius="{{r14}}"></x-import>
          <div style="flex: 1 1 360px; display: flex; flex-direction: column; gap: 8px">
            <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><h2 class="h4">{{i.car}}</h2><x-import component-from-global-scope="AutoSouk.Badge" tone="{{i.bt}}">{{i.label}}</x-import></div>
            <span style="display: flex; gap: 6px; align-items: center"><x-import component-from-global-scope="AutoSouk.Icon" name="wrench" size="{{s14}}" color="muted"></x-import><span class="body-s" style="color: var(--muted)">{{i.garage}} · {{i.note}}</span></span>
            <x-import component-from-global-scope="AutoSouk.InspectionTimeline" stage="{{i.stage}}" rejected="{{i.rej}}"></x-import>
          </div>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 10px">
            <span class="body-xs" style="color: var(--muted)">{{i.when}}</span>
            <div style="display: flex; gap: 8px">
              <x-import component-from-global-scope="AutoSouk.Button" variant="{{i.av}}" size="S" icon="{{i.ai}}">{{i.action}}</x-import>
              <sc-if value="{{i.pdf}}" hint-placeholder-val="{{no}}"><x-import component-from-global-scope="AutoSouk.Button" variant="secondary" size="S" icon="download">PDF</x-import></sc-if>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const it = (car, garage, tone, stage, label, bt, note, when, action, av, ai, extra) => ({ car, garage, tone, stage, label, bt, note, when, action, av, ai, rej: false, pdf: false, ...(extra || {}) });
    return {
      no: false, s14: 14, s18: 18, w120: 120, h88: 88, r14: 14,
      tabs: [{ label: 'All', count: 5 }, { label: 'Active', count: 3 }, { label: 'Completed', count: 1 }, { label: 'Rejected / cancelled', count: 1 }],
      items: [
        it('Volkswagen Golf 8 Life', 'Garage Atlas Auto', 'night', 3, 'Completed', 'success', 'Report ready · score 92', 'Today 18:40', 'View report', 'dark', 'file', { pdf: true }),
        it('Toyota Corolla Hybrid', 'Diagnostic Pro Ain Sebaâ', 'olive', 2, 'In progress', 'info', 'Car at the garage since 10:15', 'Today', 'Call garage', 'secondary', 'phone'),
        it('Dacia Duster Prestige', 'Speedy Check Anfa', 'sand', 1, 'Accepted', 'brand', 'Appointment confirmed by the garage', 'Yesterday', 'Cancel', 'secondary', 'x'),
        it('Fiat 500 Dolcevita', 'Garage Souss Diag', 'saffron', 0, 'Pending', 'warning', 'Waiting for the garage to accept', '2 h ago', 'Cancel', 'secondary', 'x'),
        it('Peugeot 3008 GT Line', 'Garage Menara', 'clay', 1, 'Rejected', 'danger', 'Garage fully booked — choose another', '5 Oct', 'Pick another garage', 'dark', 'refresh', { rej: true })
      ]
    };
  }
}
</script>
</body>
</html>
