version: "3"

services:
  pg:
    image: postgres
    container_name: pg_test_service
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=123456789
      - POSTGRES_DB=test_db
    ports:
      - "5431:5432"
  redis:
    image: redis:8.2.2-alpine
    container_name: redis_test_service
    command: redis-server --appendonly no --save ""
    ports:
      - "6378:6379"
